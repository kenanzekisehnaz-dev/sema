<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2127">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Şema">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html { box-sizing: border-box; color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
</style>
</head>
<body>
<title>Saha Şema Okuyucu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Düzen: tek ekran uygulama. Üstte arama, ortada şema, altta devre filtreleri, gerektiğinde alttan açılan liste. */
:root {
  --bg: #eef0f2;
  --panel: #ffffff;
  --fg: #1c2127;
  --muted: #5d6874;
  --line: #d3d8de;
  --accent: #c2410c;      /* hidrolik yağ amberi: seçim ve vurgu */
  --accent-soft: #fde7d9;
  --mark: rgba(255, 196, 0, .45);
  --paper: #ffffff;       /* şema her temada beyaz kâğıt üstünde kalır */
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d; --panel: #1d232a; --fg: #e6e9ed; --muted: #9aa4af; --line: #313a44;
    --accent: #fb8a4c; --accent-soft: #3a2518; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181d; --panel: #1d232a; --fg: #e6e9ed; --muted: #9aa4af; --line: #313a44;
  --accent: #fb8a4c; --accent-soft: #3a2518; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; }

header {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
header select, header input {
  font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0;
}
#docSel { flex: 1 1 160px; font-weight: 600; }
#pageSel { flex: 1 1 160px; }
#q { flex: 3 1 220px; }
header :focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#stage { position: relative; flex: 1; min-height: 0; }
#viewer {
  position: absolute; inset: 0; overflow: hidden; background: var(--paper);
  touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
}
#viewer svg { width: 100%; height: 100%; display: block; transform-origin: 0 0; overflow: visible; }
#viewer svg.dim path, #viewer svg.dim use { opacity: .12; }
#viewer svg.dim path[stroke="#ffffff"] { opacity: 1; }
#viewer svg.dim .on { opacity: 1; }
#viewer svg.dim #ov path, #viewer svg.dim #ov circle { opacity: 1; }
#status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); background: var(--paper); }

.fab {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); z-index: 2;
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font-size: 20px; line-height: 1; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.18);
}
#fitBtn { top: 12px; }
#clearBtn { top: 64px; }

#chips {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin;
  padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-top: 1px solid var(--line);
}
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  font: 500 12px/1 var(--font); letter-spacing: .02em; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 12px; cursor: pointer; white-space: nowrap;
}
.chip i { width: 18px; height: 5px; border-radius: 3px; display: inline-block; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.chip.grp { background: var(--fg); color: var(--panel); border-color: var(--fg); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.chip.grp[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.grp:not(:first-child) { margin-left: 10px; }

#sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; max-height: 48%;
  display: flex; flex-direction: column;
  background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 14px 14px 0 0; box-shadow: 0 -6px 20px rgba(0,0,0,.18);
}
#sheetHead {
  display: flex; align-items: center; gap: 10px; padding: 12px 8px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
#sheetTitle { flex: 1; min-width: 0; font-weight: 600; }
#sheetTitle code { font-family: var(--mono); font-size: 17px; color: var(--accent); }
#sheetTitle .sym { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; }
#sheetTitle .sw { width: 22px; height: 6px; border-radius: 3px; display: inline-block; flex: none; }
#sheetTitle small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
#sheetClose { border: 0; background: none; color: var(--muted); font-size: 22px; width: 40px; height: 40px; cursor: pointer; }
#sheetBody {
  overflow-y: auto; padding-bottom: 10px;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.res {
  display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left;
  font: inherit; color: var(--fg); background: none; border: 0; border-radius: 8px;
  padding: 10px 8px; cursor: pointer;
}
.res:hover, .res:active { background: var(--bg); }
.res .pg { flex: none; font: 500 12px var(--mono); color: var(--muted); min-width: 3.2em; font-variant-numeric: tabular-nums; }
.res .tx { min-width: 0; overflow-wrap: anywhere; }
.res .tx b { color: var(--accent); font-weight: 600; }
.group { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 8px 4px; }
.hint { color: var(--muted); padding: 4px 8px 8px; line-height: 1.5; }

#lock {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#lockForm {
  box-sizing: border-box; width: min(100%, 360px); display: flex; flex-direction: column; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px;
}
#lockForm h1 { margin: 0; font-size: 20px; }
#lockForm p { margin: 0; color: var(--muted); line-height: 1.5; }
#lockForm input {
  font: inherit; font-size: 16px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 12px;
}
#lockForm button {
  font: 600 16px var(--font); color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 12px; cursor: pointer;
}
#lockErr { color: var(--accent) !important; font-weight: 600; }
</style>

<div id="app">
  <header>
    <select id="docSel" aria-label="Makine / şema"></select>
    <select id="pageSel" aria-label="Sayfa"></select>
    <input id="q" type="search" placeholder="Ara: 45, AL3, BOOM, SWING…" autocomplete="off" aria-label="Şemada ara">
  </header>
  <div id="stage">
    <div id="viewer"></div>
    <div id="status">Şema yükleniyor…</div>
    <button class="fab" id="fitBtn" title="Tüm sayfayı göster" aria-label="Tüm sayfayı göster">⤢</button>
    <button class="fab" id="clearBtn" title="İşaretleri temizle" aria-label="İşaretleri temizle">✕</button>
    <div id="sheet">
      <div id="sheetHead"><div id="sheetTitle"></div><button id="sheetClose" aria-label="Kapat">×</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <nav id="chips" aria-label="Devre filtresi" hidden></nav>
</div>

<div id="lock" hidden>
  <form id="lockForm">
    <h1>Saha Şema Okuyucu</h1>
    <p>Bu cihazda ilk açılış. Şifreyi bir kez girin; bu cihaz hatırlayacak.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Şifre" aria-label="Şifre" required>
    <button type="submit">Aç</button>
    <p id="lockErr" hidden></p>
  </form>
</div>

<script src="app.js"></script>

</body>
</html>
